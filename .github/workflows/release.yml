name: Publicar libro

# Construye el libro en español y lo publica en GitHub Pages (rama gh-pages)
# cada vez que hay cambios en main.

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publicar-libro
  cancel-in-progress: false

jobs:
  publish:
    name: Construir y publicar
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - name: set timezone
        run: |
          TZ="Europe/London" &&
          sudo ln -snf /usr/share/zoneinfo/$TZ /etc/localtime

      - name: install linux deps
        run: |
          sudo apt-get -y install openssl graphviz nano texlive graphviz-dev unzip build-essential

      - name: build the book
        run: |
          uv run quarto render --execute
        env:
          # This forces Quarto to use the Python inside your uv venv
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run quarto publish gh-pages --no-render --no-browser
